<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Master Bank</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body{
  margin:0;
  padding:0;
  height:100%;
  font-family:Arial;
  background:#111;
  color:white;
  overflow:auto;
}
h1{text-align:center;margin:8px 0}
/* use responsive grid to avoid empty slots and allow wrapping */
.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:10px;
  padding:10px;
}
.player{border-radius:14px;padding:10px;text-align:center}
.balance{font-size:28px;color:#00ffcc}
.collect{font-size:22px;color:#ffcc00}
.name input{width:92%;font-size:16px;text-align:center;margin-bottom:5px}
.money button{margin:4px;padding:12px 14px;border:none;border-radius:8px;font-size:16px}
.actions button{margin:4px;padding:12px 16px;border:none;border-radius:8px;font-size:15px}
.add{background:#2ecc71}
.sub{background:#e74c3c;color:white}
.send{background:#3498db;color:white}
.clear{background:gray;color:white}
.lock{background:black;color:white;font-size:14px}
.zero{background:#8e44ad;color:white}
.footer button{width:95%;margin:6px auto;display:block;background:orange;font-size:18px}
.stats{font-size:12px;margin-top:6px}
</style>
</head>

<body>

<h1>💰 Master Bank 💰</h1>

<script>
const money=[5,10,25,50,100,200,500,1000,2000,5000,10000];
const colors=["#1abc9c","#9b59b6","#f39c12","#e67e22","#3498db"];
const players=5;

let balance=[],collect=[],locked=[],count=[],names=[];

function load(){
 let d=JSON.parse(localStorage.getItem("MB_DATA"));
 if(d){({balance,collect,locked,count,names}=d);}
 else{
  for(let i=0;i<players;i++){
   balance[i]=0; collect[i]=0; locked[i]=false;
   count[i]={}; names[i]="Player "+(i+1);
  }
 }
}

function save(){
 localStorage.setItem("MB_DATA",JSON.stringify({balance,collect,locked,count,names}));
}

function f(n){return n.toLocaleString();}

function update(){
 for(let i=0;i<players;i++){
  document.getElementById("b"+i).innerText=f(balance[i]);
  document.getElementById("c"+i).innerText=f(collect[i]);
  document.getElementById("n"+i).value=names[i];

  let s="";
  for(let m of money) if(count[i][m]) s+=`${m}:${count[i][m]} `;
  document.getElementById("s"+i).innerText=s;

  let t=document.getElementById("t"+i);
  t.innerHTML="";
  for(let j=0;j<players;j++){
   if(j!==i){
    let btn=document.createElement("button");
    btn.className="send";
    btn.innerText="➡️ "+names[j];
    btn.onclick=()=>sendMoney(i,j);
    t.appendChild(btn);
   }
  }
 }
 save();
}

function addMoney(i,v){
 if(locked[i])return;
 collect[i]+=v;
 count[i][v]=(count[i][v]||0)+1;
 update();
}

function addBalance(i){
 if(locked[i])return;
 balance[i]+=collect[i];
 collect[i]=0; count[i]={};
 update();
}

function subBalance(i){
 if(locked[i])return;
 if(balance[i]<collect[i]) return alert("❌ الرصيد لا يكفي");
 balance[i]-=collect[i];
 collect[i]=0; count[i]={};
 update();
}

function sendMoney(from,to){
 if(locked[from])return;
 if(balance[from]<collect[from]) return alert("❌ الرصيد لا يكفي");
 balance[from]-=collect[from];
 balance[to]+=collect[from];
 collect[from]=0; count[from]={};
 update();
}

function clearCollect(i){
 collect[i]=0; count[i]={}; update();
}

function zeroBalance(i){
 if(!confirm("تصفير رصيد اللاعب؟"))return;
 balance[i]=0; collect[i]=0; count[i]={};
 update();
}

function lockPlayer(i){
 locked[i]=!locked[i];
 document.getElementById("l"+i).innerText=locked[i]?"🔓 فتح":"🔒 قفل";
 save();
}

function changeName(i,v){
 names[i]=v;
 update();
}

function showReport(){
 let arr=[];
 for(let i=0;i<players;i++) arr.push({name:names[i],balance:balance[i]});
 arr.sort((a,b)=>b.balance-a.balance);
 let txt="📊 تقرير الجولة\n\n";
 arr.forEach((p,i)=>{
  let m=i==0?"🥇":i==1?"🥈":i==2?"🥉":"";
  txt+=`${m} ${i+1}. ${p.name} : ${p.balance.toLocaleString()}\n`;
 });
 alert(txt);
}
</script>

<div class="container">
<script>
load();
for(let i=0;i<players;i++){
document.write(`
<div class="player" style="background:${colors[i]}20">
 <div class="name">
  <input id="n${i}" onchange="changeName(${i},this.value)">
 </div>

 <div class="balance">💵 <span id="b${i}">0</span></div>
 <div class="collect">🧺 <span id="c${i}">0</span></div>

 <div class="money">
 ${money.map(v=>`<button onclick="addMoney(${i},${v})">${v}</button>`).join("")}
 </div>

 <div class="actions">
  <button class="add" onclick="addBalance(${i})">➕</button>
  <button class="sub" onclick="subBalance(${i})">➖</button>
  <button class="clear" onclick="clearCollect(${i})">❌</button>
  <button class="zero" onclick="zeroBalance(${i})">0️⃣</button>
 </div>

 <div id="t${i}" class="actions"></div>

 <button id="l${i}" class="lock" onclick="lockPlayer(${i})">🔒 قفل</button>
 <div class="stats" id="s${i}"></div>
</div>
`);
}
</script>
</div>

<div class="footer">
<button onclick="showReport()">📊 تقرير الجولة</button>
<button onclick="localStorage.removeItem('MB_DATA');location.reload();">🔄 Reset Game</button>
</div>

<script>update();</script>

</body>
</html>
